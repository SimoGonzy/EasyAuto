<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EasyAuto</title>
    <link rel="stylesheet" href="/stylecss/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div style="background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 350px; text-align: center;">
        <h2 style="color: var(--primary);">Accedi a <span>EasyAuto</span></h2>
        <form style="margin-top: 20px;">
            <input type="email" placeholder="Email" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px;">
            <input type="password" placeholder="Password" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 5px;">
            <button type="submit" class="btn-login" style="width: 100%; cursor: pointer;">Entra</button>
        </form>
        <p style="margin-top: 20px;"><a href="index.html" style="color: #888; text-decoration: none; font-size: 0.8rem;">← Torna al confronto</a></p>
    </div>

</body>
</html>
