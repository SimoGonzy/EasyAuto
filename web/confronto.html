<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Easy Auto | Confronto 1vs1</title>
        <link rel="stylesheet" href="stylecss/base.css">
        <link rel="stylesheet" href="stylecss/confronto.css">
        <link rel="icon" type="image/png" href="img/logo.png">
    </head>
    <body>
        <style>
            .search-container { position: relative; width: 300px; }
            #searchBar1 { width: 100%; padding: 10px; border-radius: 20px; border: 1px solid #ccc; }
            #searchBar2 { width: 100%; padding: 10px; border-radius: 20px; border: 1px solid #ccc; }
            .results-box { 
                position: absolute; width: 100%; background: white; 
                border: 1px solid #ddd; display: none; z-index: 100;
            }
            .result-item { padding: 10px; cursor: pointer; }
            .result-item:hover { background-color: #f0f0f0; }
        </style>
        <header class="main-header">
            <div class="logo">
                <img src="img/logo.png" alt="Logo EasyAuto">
                <a href="index.html" style="text-decoration: none;"><h1>Easy<span>Auto</span></h1></a>
            </div>
            
            <nav class="nav-container">
                <a href="index.html" class="btn-login">Home</a>
                <a href="login.html" class="btn-login">Accedi</a>
            </nav>
        </header>

        <main class="comparison-container">
            <section class="selection-bar">
                <div class="select-wrapper">
                    <label>Prima Auto</label>
                    <div class="search-container">
                        <input type="text" id="searchBar1" placeholder="Cerca prima auto..." autocomplete="off">
                        <div id="results1" class="results-box"></div>
                    </div>
                </div>

                <div class="vs-badge">VS</div>

                <div class="select-wrapper">
                    <label>Seconda Auto</label>
                    <div class="search-container">
                        <input type="text" id="searchBar2" placeholder="Cerca seconda auto..." autocomplete="off">
                        <div id="results2" class="results-box"></div>
                    </div>
                </div>
            </section>

            <div class="comparison-grid">
                <div class="car-column">
                    <div class="car-card">
                        <img id="car1-img" src="" alt="Auto 1">
                        <h2 id="car1-name">Seleziona Auto A</h2>
                    </div>
                    <div class="data-value" id="car1-price">-</div>
                    <div class="data-value" id="car1-fuel">-</div>
                    <div class="data-value" id="car1-maint">-</div>
                </div>

                <div class="labels-column">
                    <div class="spacer-img"></div>
                    <div class="label">Prezzo Listino</div>
                    <div class="label">Consumo</div>
                    <div class="label">Manutenzione</div>
                </div>

                <div class="car-column">
                    <div class="car-card">
                        <img id="car2-img" src="" alt="Auto 2">
                        <h2 id="car2-name">Seleziona Auto B</h2>
                    </div>
                    <div class="data-value" id="car2-price">-</div>
                    <div class="data-value" id="car2-fuel">-</div>
                    <div class="data-value" id="car2-maint">-</div>
                </div>
            </div>
        </main>

        <script src="javascript/database.js"></script>
    </body>
</html>
