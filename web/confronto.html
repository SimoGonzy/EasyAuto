<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Easy Auto | Confronto 1vs1</title>
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="stylecss/base.css">
  <link rel="stylesheet" href="stylecss/confronto.css">
</head>

<body class="min-h-screen">
  <header class="main-header">
    <div class="logo">
      <a href="../index.html" class="logo-link" aria-label="Vai alla home EasyAuto">
        <img src="img/logo.png" alt="Logo EasyAuto" />
      </a>
    </div>
    <nav class="nav-container">
      <a href="../index.html" class="btn-login">Home</a>
      <a href="carburanti.html" class="btn-login">Carburanti</a>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto p-4 md:p-8 flex flex-col gap-8">
    
    <section class="card bg-base-100 shadow-xl">
      <div class="card-body flex-col md:flex-row items-center gap-4">
        <div class="form-control w-full">
          <label class="label"><span class="label-text font-bold">Prima Auto</span></label>
          <div class="search-container">
            <input type="text" id="searchBar1" placeholder="Cerca prima auto..." class="input input-bordered w-full" autocomplete="off" />
            <div id="results" class="z-50 results-box"></div>
          </div>
        </div>

        <div class="divider md:divider-horizontal font-black text-xl">VS</div>

        <div class="form-control w-full">
          <label class="label"><span class="label-text font-bold">Seconda Auto</span></label>
          <div class="search-container">
            <input type="text" id="searchBar2" placeholder="Cerca seconda auto..." class="input input-bordered w-full" autocomplete="off" />
            <div id="results2" class="z-50 results-box"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div class="card bg-base-100 shadow-sm p-6 text-center">
        <img id="car1-img" src="./img/default-car.png" class="w-full max-w-xs mx-auto rounded-xl mb-4" />
        <h2 id="car1-name" class="text-xl font-bold uppercase tracking-tight">Seleziona Auto A</h2>
      </div>
      <div class="card bg-base-100 shadow-sm p-6 text-center">
        <img id="car2-img" src="./img/default-car.png" class="w-full max-w-xs mx-auto rounded-xl mb-4" />
        <h2 id="car2-name" class="text-xl font-bold uppercase tracking-tight">Seleziona Auto B</h2>
      </div>
    </div>

    <div class="flex flex-col gap-2">
      
      <div class="collapse collapse-arrow bg-base-100 border border-base-300 shadow-sm">
        <input type="checkbox" checked /> 
        <div class="collapse-title text-lg font-bold">GENERALITÀ</div>
        <div class="collapse-content flex flex-col gap-4 cont" >
          <div class="flex items-center justify-between border-b border-base-200 py-2" >
            <div id="car1-info" class="w-1/3 text-center font-medium">-</div>
            <div class="w-1/3 text-center text-xs font-bold">INFORMAZIONI</div>
            <div id="car2-info" class="w-1/3 text-center font-medium">-</div>
          </div>
          <div class="flex items-center justify-between border-b border-base-200 py-2" >
            <div id="car1-pot" class="w-1/3 text-center font-medium">-</div>
            <div class="w-1/3 text-center text-xs font-bold">POTENZA</div>
            <div id="car2-pot" class="w-1/3 text-center font-medium">-</div>
          </div>
          <div class="flex items-center justify-between border-b border-base-200 py-2" >
            <div id="car1-consumi" class="w-1/3 text-center font-medium">-</div>
            <div class="w-1/3 text-center text-xs font-bold">CONSUMI</div>
            <div id="car2-consumi" class="w-1/3 text-center font-medium">-</div>
          </div>
          <div class="flex items-center justify-between border-b border-base-200 py-2">
            <div id="car1-euro" class="w-1/3 text-center font-medium">-</div>
            <div class="w-1/3 text-center text-xs font-bold">STANDARD AMBIENTALI</div>
            <div id="car2-euro" class="w-1/3 text-center font-medium">-</div>
          </div>
          <div class="flex items-center justify-between py-2">
            <div id="car1-trasm" class="w-1/3 text-center font-medium">-</div>
            <div class="w-1/3 text-center text-xs font-bold">TRASMISSIONE</div>
            <div id="car2-trasm" class="w-1/3 text-center font-medium">-</div>
          </div>
        </div>
      </div>

      <div class="collapse collapse-arrow bg-base-100 border border-base-300 shadow-sm">
        <input type="checkbox" /> 
        <div class="collapse-title text-lg font-bold">ANALISI AI</div>
        <div class="collapse-content">
          <div class="flex flex-col md:flex-row gap-4 items-stretch">
            <div id="ai-report-container1" class="flex-1 rounded-box ai-box">
              <p id="ai-text1" class="italic text-sm text-base-content/70">In attesa di selezione...</p>
            </div>
            <div class="flex items-center justify-center font-bold text-xs">RISPOSTA AI</div>
            <div id="ai-report-container2" class="flex-1 rounded-box ai-box">
              <p id="ai-text2" class="italic text-sm text-base-content/70">In attesa di selezione...</p>
            </div>
          </div>
        </div>
      </div>

      <div class="collapse collapse-arrow bg-base-100 border border-base-300 shadow-sm">
        <input type="checkbox" /> 
        <div class="collapse-title text-lg font-bold">COSTI</div>
        <div class="collapse-content flex flex-col gap-4 cont">
          <div class="flex items-center justify-between border-b border-base-200 py-2">
            <div id="car1-bollo" class="w-1/3 text-center font-medium">-</div>
            <div class="w-1/3 text-center text-xs font-bold">BOLLO</div>
            <div id="car2-bollo" class="w-1/3 text-center font-medium">-</div>
          </div>
          <div class="flex items-center justify-between py-2">
            <div id="car1-carburante" class="w-1/3 text-center font-medium">-</div>
            <div class="w-1/3 text-center text-xs font-bold">CARBURANTE</div>
            <div id="car2-carburante" class="w-1/3 text-center font-medium">-</div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="javascript/searchbar.js"></script>
  <script src="javascript/collapsible.js"></script>
</body>
</html>
