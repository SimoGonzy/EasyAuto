<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Easy Auto | Confronto 1vs1</title>
        <link rel="stylesheet" href="stylecss/base.css">
        <link rel="stylesheet" href="stylecss/confronto.css">
        <link rel="icon" type="image/png" href="img/logo.png">
    </head>
    <body>

        <header class="main-header">
            <div class="logo">
                <img src="img/logo.png" alt="Logo EasyAuto">
                <a href="index.html" style="text-decoration: none;"><h1>Easy<span>Auto</span></h1></a>
            </div>
            
            <nav class="nav-container">
                <a href="index.html" class="btn-login">Home</a>
                <a href="login.html" class="btn-login">Accedi</a>
            </nav>
        </header>

        <main class="comparison-container">
            
            <!-- -->
            <section class="selection-bar">
                <div class="select-wrapper">
                    <label>Prima Auto</label>
                    <div class="search-container">
                        <input type="text" id="searchBar1" placeholder="Cerca prima auto..." autocomplete="off">
                        <div id="results" class="results-box"></div>
                    </div>
                </div>

                <div class="vs-badge">VS</div>

                <div class="select-wrapper">
                    <label>Seconda Auto</label>
                    <div class="search-container">
                        <input type="text" id="searchBar2" placeholder="Cerca seconda auto..." autocomplete="off">
                        <div id="results2" class="results-box"></div>
                    </div>
                </div>
            </section>
            <!-- -->


            <!-- -->
            <div class="comparison-grid">
                <div class="car-info">
                    <div class="car-card">
                        <img id="car1-img" src="img/default-car.png" alt="Auto 1">
                        <h2 id="car1-name">Seleziona Auto A</h2>
                    </div>

                    <div></div>

                    <div class="car-card">
                        <img id="car2-img" src="img/default-car.png" alt="Auto 2">
                        <h2 id="car2-name">Seleziona Auto B</h2>
                    </div>
                </div>

                <div class="car-info">
                    <div class="data-value" id="car1-info">-</div>
                    <div class="label">INFORMAZIONI</div>
                    <div class="data-value" id="car2-info">-</div>
                </div>

                <div class="car-info">
                    <div class="data-value" id="car1-pot">-</div>
                    <div class="label">POTENZA</div>
                    <div class="data-value" id="car2-pot">-</div>
                </div>

                <div class="car-info">
                    <div class="data-value" id="car1-consumi">-</div>
                    <div class="label">CONSUMI</div>
                    <div class="data-value" id="car2-consumi">-</div>
                </div>

                <div class="car-info">
                    <div class="data-value" id="car1-euro">-</div>
                    <div class="label">STANDARD AMBIENTALI</div>
                    <div class="data-value" id="car2-euro">-</div>
                </div>

                <div class="car-info">
                    <div class="data-value" id="car1-trasm">-</div>
                    <div class="label">TRASMISSIONE</div>
                    <div class="data-value" id="car2-trasm">-</div>
                </div>

                <div class="car-info">
                    <div class="data-value" id="car1-info">-</div>
                    <div class="label">---</div>
                    <div class="data-value" id="car2-info">-</div>
                </div>
            </div>
            <!--  -->

        </main>

        <script src="javascript/searchbar.js"></script>
    </body>
</html>
