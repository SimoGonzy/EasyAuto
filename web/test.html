<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="search-container">
        <input type="text" id="searchBar" placeholder="Cerca su database..." autocomplete="off">
        <div id="results" class="results-box"></div>
    </div>

    <style>
        .search-container { position: relative; width: 300px; }
        #searchBar { width: 100%; padding: 10px; border-radius: 20px; border: 1px solid #ccc; }
        .results-box { 
            position: absolute; width: 100%; background: white; 
            border: 1px solid #ddd; display: none; z-index: 100;
        }
        .result-item { padding: 10px; cursor: pointer; }
        .result-item:hover { background-color: #f0f0f0; }
    </style>
    <script src="javascript/test.js"></script>
</body>
</html>
