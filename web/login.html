<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CarCompare</title>
    <link rel="stylesheet" href="stylecss/base.css">
    <link rel="stylesheet" href="stylecss/login.css">
    <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body class="login-page">

    <header class="main-header">
        <div class="logo">
            <img src="img/logo.png" alt="Logo">
            <a href="index.html" style="text-decoration: none;"><h1>Easy<span>Auto</span></h1></a>
        </div>
    </header>

    <div class="login-container">
        <main class="login-card">
            <h2>Accedi al portale</h2>
            <form id="auth-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="nome@esempio.it" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="********" required>
                </div>
                <button type="submit" class="btn-login">Entra</button>
            </form>
            <div class="login-footer-links">
                <p>Non hai un account? <a href="#">Registrati ora</a></p>
                <a href="confronto.html" class="back-link">← Torna al confronto</a>
            </div>
        </main>
    </div>

    <footer class="main-footer">
        <div class="footer-content">
            <p>© 2026 <span>EasyAuto</span> - Tutti i diritti riservati</p>
        </div>
    </footer>

</body>
</html>
